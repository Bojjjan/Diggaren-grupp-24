[build-system]
requires = ["setuptools>=42", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "diggaren-grupp-24"
version = "0.1.0"
description = "Ya dig?"
authors = [
    {name = "Joar", email = "joar@bomikael.se"}
]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "blinker==1.9.0",
    "certifi==2024.12.14",
    "charset-normalizer==3.4.0",
    "click==8.1.7",
    "colorama==0.4.6",
    "Flask==3.1.0",
    "Flask-Cors==5.0.0",
    "greenlet==3.1.1",
    "idna==3.10",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.4",
    "MarkupSafe==3.0.2",
    "playwright==1.49.1",
    "pyee==12.0.0",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "typing_extensions==4.12.2",
    "urllib3==2.2.3",
    "Werkzeug==3.1.3",
    "PyMySQL~=1.1.1"
]

[tool.setuptools]
packages = ["src.main.api", "src.main.models", "src.main.server"]
